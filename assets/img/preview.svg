<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="羽渡鸦夜 · Yudu Raven Night">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b0718"/>
      <stop offset="48%"  stop-color="#171034"/>
      <stop offset="100%" stop-color="#0d0a20"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#eef0ff"/>
      <stop offset="45%"  stop-color="#a9c4ff"/>
      <stop offset="100%" stop-color="#b18cff"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff9ed4"/>
      <stop offset="100%" stop-color="#ffc2e2"/>
    </linearGradient>
    <!-- 徽记专用：必须用 userSpaceOnUse，否则零宽度的竖线拿不到渐变，整条不会画 -->
    <linearGradient id="iceEmblem" gradientUnits="userSpaceOnUse" x1="-52" y1="-52" x2="52" y2="52">
      <stop offset="0%"   stop-color="#eef0ff"/>
      <stop offset="45%"  stop-color="#a9c4ff"/>
      <stop offset="100%" stop-color="#b18cff"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a9c4ff" stop-opacity=".34"/>
      <stop offset="60%"  stop-color="#9d7bff" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#9d7bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- 光晕 -->
  <ellipse cx="150" cy="90"  rx="230" ry="150" fill="url(#halo)" filter="url(#soft)"/>
  <ellipse cx="850" cy="220" rx="250" ry="160" fill="url(#halo)" filter="url(#soft)"/>

  <!-- 冰裂纹 -->
  <g stroke="#a9c4ff" stroke-opacity=".13" stroke-width="1" fill="none">
    <path d="M690 0 L760 62 L700 140 L600 108 L640 20 Z"/>
    <path d="M760 62 L900 40 L960 130 L700 140"/>
    <path d="M900 40 L1000 78"/>
    <path d="M600 108 L520 190 L640 246 L700 140"/>
    <path d="M520 190 L380 168 L420 268 L640 246"/>
  </g>

  <!-- 星屑 -->
  <g fill="#eef0ff" fill-opacity=".7">
    <circle cx="70"  cy="46"  r="1.6"/><circle cx="240" cy="28"  r="1.2"/>
    <circle cx="420" cy="58"  r="1.5"/><circle cx="560" cy="34"  r="1.1"/>
    <circle cx="905" cy="70"  r="1.4"/><circle cx="960" cy="250" r="1.5"/>
    <circle cx="300" cy="268" r="1.3"/><circle cx="120" cy="230" r="1.2"/>
  </g>
  <g fill="#ff9ed4" fill-opacity=".8">
    <circle cx="330" cy="34" r="1.4"/><circle cx="820" cy="34" r="1.2"/>
    <circle cx="60"  cy="258" r="1.3"/>
  </g>

  <!-- 冰晶徽记 -->
  <g transform="translate(120,150)" stroke="url(#iceEmblem)" stroke-width="2.4"
     stroke-linecap="round" fill="none">
    <path d="M0 -52 v104"/>
    <path d="M-45 -26 L45 26"/>
    <path d="M45 -26 L-45 26"/>
    <path d="M0 -40 L-13 -50 M0 -40 L13 -50"/>
    <path d="M0 40 L-13 50 M0 40 L13 50"/>
    <path d="M-34 -20 L-48 -14 M-34 20 L-48 14"/>
    <path d="M34 -20 L48 -14 M34 20 L48 14"/>
  </g>

  <!-- 文字 -->
  <g font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif">
    <text x="216" y="132" font-size="60" letter-spacing="9" fill="url(#ice)">羽渡鸦夜</text>
  </g>
  <text x="220" y="166" font-family="Consolas, 'JetBrains Mono', monospace"
        font-size="12.5" letter-spacing="7.4" fill="#7d7fa8">YUDU RAVEN NIGHT</text>

  <!-- 分隔线 -->
  <rect x="220" y="188" width="330" height="1" fill="#a9c4ff" fill-opacity=".38"/>

  <text x="220" y="214" font-family="Inter, 'PingFang SC', sans-serif"
        font-size="14" fill="#b6b9dd">Java 后端 · C++ 系统 · 全栈 Web</text>

  <!-- 藏不住的粉 -->
  <text x="220" y="245" font-family="Inter, 'PingFang SC', sans-serif"
        font-size="12.5" fill="url(#warm)">冰山之下，请勿靠近（除非你很想）</text>

  <!-- 右下角签名 -->
  <text x="960" y="276" text-anchor="end" font-family="Consolas, monospace"
        font-size="10.5" letter-spacing="2.6" fill="#5f6188">代码如羽 · 渡夜而行</text>
</svg>
